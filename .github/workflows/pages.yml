name: Deploy backup landing page mirror to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage Pages content
        run: |
          mkdir -p _site
          # Mirror the full installer/ tree, dereferencing symlinks
          # (here-now's publish.sh skips them; we do the same here so both
          # mirrors stay in sync). Excludes .DS_Store and the .herenow
          # state cache which we don't want public.
          rsync -aL \
            --exclude '.DS_Store' \
            --exclude '.herenow' \
            installer/ _site/
          # Substitute {{BUILD_STAMP}} in the landing index so the Pages
          # mirror has the same UTC stamp the canonical here.now publish
          # gets. Format matches install-telemetry build_stamp.
          STAMP="$(date -u +%Y%m%d%H%M%S)"
          sed "s/{{BUILD_STAMP}}/$STAMP/g" _site/index.html > _site/index.html.tmp
          mv _site/index.html.tmp _site/index.html

      - name: Guard against unfilled placeholders
        run: |
          # Fail fast if any '{{' survived in HTML we're about to deploy.
          # Prevents the BUILD_STAMP class of regression (literal
          # `Build {{BUILD_STAMP}}` rendering on the live page).
          # Restrict to top-level HTML only — dashboard-demo/index.html
          # is a built artifact whose template-engine-style {{ }} braces
          # may legitimately appear in other contexts.
          if grep -l '{{' _site/index.html _site/dashboard-demo/index.html 2>/dev/null; then
            echo "::error::Unfilled {{ placeholder found in HTML being deployed"
            grep -n '{{' _site/index.html _site/dashboard-demo/index.html || true
            exit 1
          fi
          echo "✓ No unfilled placeholders in landing or demo dashboard"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
