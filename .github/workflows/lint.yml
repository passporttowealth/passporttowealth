name: Lint shell + PowerShell

# Static analysis on the install scripts and skill helpers. Both installers
# are streamed and executed (`curl … | bash`, `irm … | iex`) so static safety
# is the only gate before they reach a user's laptop.

on:
  pull_request:
    paths:
      - 'installer/install.sh'
      - 'installer/install'
      - 'installer/install.ps1'
      - 'installer/publish-landing.sh'
      - 'skill/scripts/**.sh'
      - '.github/workflows/lint.yml'
  push:
    branches: [main, next]

jobs:
  shellcheck:
    name: shellcheck (bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: --severity=warning
        with:
          # Lint the install scripts + the skill's user-facing helpers. Skip
          # legacy/ (intentionally archived) and node_modules.
          ignore_paths: >-
            installer/legacy
            node_modules
          additional_files: 'installer/install'

  psscriptanalyzer:
    name: PSScriptAnalyzer (install.ps1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          # Excluded rules and why:
          # - PSAvoidGlobalVars: install.ps1 intentionally uses $Global: scope
          #   to share state across functions (CurrentStep, Workspace, etc.).
          #   Normal PowerShell installer pattern.
          # - PSUseBOMForUnicodeEncodedFile: macOS-edited files don't typically
          #   carry a UTF-8 BOM. Adding one would create churn on every edit.
          # - PSUseUsingScopeModifierInNewRunspaces: false positive when using
          #   `param + -ArgumentList` to pass values into Start-Job (the
          #   canonical alternative to $Using:). Verified the telemetry POST
          #   works with the current pattern.
          # - PSAvoidUsingWriteHost: Write-Host is intentional for an
          #   interactive installer. Output is for the user reading the
          #   terminal, not for capture/redirection. Suppressed in user code,
          #   not suppressed in script execution.
          # - PSUseApprovedVerbs: Pause-ForUser uses an unapproved verb
          #   (Pause). Cosmetic — the helper is internal, never exported.
          # - PSAvoidUsingEmptyCatchBlock: install scripts intentionally
          #   swallow non-fatal errors (e.g. `try { Register-EngineEvent } catch { }`)
          #   to keep going when an optional handler can't be registered.
          # - PSAvoidOverwritingBuiltInCmdlets: our `Write-Log` helper
          #   shadows a PowerShell core cmdlet of the same name. Rename
          #   to `Write-InstallLog` is a future cleanup (40 call sites);
          #   no functional collision today since we don't import the
          #   conflicting module. Tracked in backlog for end-of-prototype.
          $exclude = @(
              'PSAvoidGlobalVars',
              'PSUseBOMForUnicodeEncodedFile',
              'PSUseUsingScopeModifierInNewRunspaces',
              'PSAvoidUsingWriteHost',
              'PSUseApprovedVerbs',
              'PSAvoidUsingEmptyCatchBlock',
              'PSAvoidOverwritingBuiltInCmdlets'
          )
          $results = Invoke-ScriptAnalyzer -Path installer/install.ps1 `
              -Severity Warning,Error `
              -ExcludeRule $exclude
          if ($results) {
              $results | Format-Table -AutoSize
              Write-Host ""
              Write-Host "❌ PSScriptAnalyzer found $($results.Count) issue(s)" -ForegroundColor Red
              exit 1
          }
          Write-Host "✓ install.ps1 is clean (Warning + Error severity, excluding style-only rules)" -ForegroundColor Green
