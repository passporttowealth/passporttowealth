name: CI

# Runs on every PR + every push to main. Locks in the regression suite at
# tests/test_pipeline.py — see dev/backlog.md Epic 1 for what's covered.
# Real network calls (publish.sh) are NOT exercised here; that's manual.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pipeline-regression:
    name: Pipeline regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install runtime deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate demo kit (deterministic; verifies generator runs)
        run: python3 demo-kit/build_demo.py

      - name: Run regression suite
        run: python3 tests/test_pipeline.py

      - name: Verify /docs page is in sync with install scripts
        # Fails if installer/install.sh or install.ps1 reference any package,
        # URL, or operation that's not documented in installer/build_docs.py's
        # curated map. Forces the human-readable docs to stay aligned with
        # what the install actually does.
        run: python3 installer/build_docs.py --check
