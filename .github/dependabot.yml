version: 2
updates:
  # Python deps used by the skill pipeline (classify, normalize, build_site, etc.)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "deps:python"
    commit-message:
      prefix: "deps(pip)"

  # Cloudflare Worker (wrangler + any future runtime deps)
  - package-ecosystem: npm
    directory: "/cloudflare-worker"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "deps:worker"
    commit-message:
      prefix: "deps(npm)"

  # GitHub Actions used in our workflows (actions/checkout, etc.)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - "deps"
      - "deps:actions"
    commit-message:
      prefix: "deps(actions)"
