<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="ss2-title ss2-desc">
  <title id="ss2-title">Step 2: Click "More info"</title>
  <desc id="ss2-desc">Same SmartScreen dialog with the "More info" link highlighted.</desc>
  <defs>
    <filter id="ssh2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ss2arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F1E33"/>
    </marker>
  </defs>
  <rect width="320" height="220" fill="#FAF8F4"/>
  <g filter="url(#ssh2)">
    <rect x="40" y="30" width="240" height="160" rx="2" fill="#1E48A8"/>
    <text x="55" y="58" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#fff">Windows protected your PC</text>
    <text x="55" y="84" font-family="Segoe UI, sans-serif" font-size="10" fill="#E8E8E8">Microsoft Defender SmartScreen prevented an</text>
    <text x="55" y="98" font-family="Segoe UI, sans-serif" font-size="10" fill="#E8E8E8">unrecognized app from starting. Running this app</text>
    <text x="55" y="112" font-family="Segoe UI, sans-serif" font-size="10" fill="#E8E8E8">might put your PC at risk.</text>
    <!-- "More info" highlighted -->
    <text x="55" y="135" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#FFD700"
          text-decoration="underline">More info</text>
    <rect x="180" y="160" width="90" height="22" fill="#fff"/>
    <text x="225" y="175" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#1D2433">Don't run</text>
  </g>
  <g>
    <path d="M 30 145 Q 35 138 50 138" stroke="#0F1E33" stroke-width="1.5" fill="none" marker-end="url(#ss2arr)"/>
    <text x="20" y="158" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" fill="#0F1E33" font-weight="600">Click "More info"</text>
  </g>
</svg>
