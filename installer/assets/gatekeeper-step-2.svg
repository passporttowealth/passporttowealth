<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="gk2-title gk2-desc">
  <title id="gk2-title">Step 2: Right-click Welcome.command and choose Open</title>
  <desc id="gk2-desc">Finder context menu showing Open at the top, surfaced by right-clicking the file.</desc>
  <defs>
    <filter id="sh2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F1E33"/>
    </marker>
  </defs>
  <rect width="320" height="220" fill="#FAF8F4"/>
  <!-- Finder window stub -->
  <g filter="url(#sh2)">
    <rect x="20" y="20" width="280" height="160" rx="10" fill="#FFFFFF" stroke="#D1D1D1" stroke-width="0.5"/>
    <rect x="20" y="20" width="280" height="22" rx="10" fill="#E8E8E8"/>
    <rect x="20" y="30" width="280" height="12" fill="#E8E8E8"/>
    <circle cx="32" cy="31" r="4" fill="#FF5F57"/>
    <circle cx="44" cy="31" r="4" fill="#FEBC2E"/>
    <circle cx="56" cy="31" r="4" fill="#28C840"/>
    <text x="160" y="35" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#1D2433">Downloads</text>
    <!-- File icon (selected, highlighted) -->
    <g transform="translate(40,60)">
      <rect x="0" y="0" width="56" height="76" rx="6" fill="#0F1E33" opacity="0.10"/>
      <rect x="10" y="6" width="36" height="44" rx="3" fill="#fff" stroke="#0F1E33" stroke-width="1.2"/>
      <text x="28" y="32" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F1E33">.cmd</text>
      <text x="28" y="62" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#1D2433">Welcome</text>
      <text x="28" y="71" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#5E6473">.command</text>
    </g>
    <!-- Right-click context menu -->
    <g filter="url(#sh2)">
      <rect x="100" y="60" width="170" height="115" rx="6" fill="#FFFFFF" stroke="#C8C8C8"/>
      <!-- Open (highlighted) -->
      <rect x="104" y="64" width="162" height="20" rx="3" fill="#0F1E33"/>
      <text x="115" y="78" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#fff">Open</text>
      <!-- Other items -->
      <text x="115" y="98" font-family="-apple-system, sans-serif" font-size="11" fill="#1D2433">Open With</text>
      <text x="115" y="115" font-family="-apple-system, sans-serif" font-size="11" fill="#1D2433">Move to Trash</text>
      <line x1="104" y1="124" x2="266" y2="124" stroke="#E0E0E0"/>
      <text x="115" y="139" font-family="-apple-system, sans-serif" font-size="11" fill="#1D2433">Get Info</text>
      <text x="115" y="156" font-family="-apple-system, sans-serif" font-size="11" fill="#1D2433">Compress</text>
      <text x="115" y="170" font-family="-apple-system, sans-serif" font-size="11" fill="#1D2433">Duplicate</text>
    </g>
  </g>
  <!-- Annotation -->
  <g>
    <path d="M 30 200 Q 60 180 95 75" stroke="#0F1E33" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>
    <text x="20" y="213" font-family="-apple-system, sans-serif" font-size="11" fill="#0F1E33" font-weight="600">Right-click → Open</text>
  </g>
</svg>
