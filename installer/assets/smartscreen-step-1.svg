<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="ss1-title ss1-desc">
  <title id="ss1-title">Step 1: Windows shows the SmartScreen warning</title>
  <desc id="ss1-desc">Microsoft Defender SmartScreen blue dialog reading "prevented an unrecognized app from starting".</desc>
  <defs>
    <filter id="ssh1" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="320" height="220" fill="#FAF8F4"/>
  <g filter="url(#ssh1)">
    <!-- Blue SmartScreen dialog -->
    <rect x="40" y="30" width="240" height="160" rx="2" fill="#1E48A8"/>
    <!-- Title bar -->
    <text x="55" y="58" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#fff">Windows protected your PC</text>
    <text x="55" y="84" font-family="Segoe UI, sans-serif" font-size="10" fill="#E8E8E8">Microsoft Defender SmartScreen prevented an</text>
    <text x="55" y="98" font-family="Segoe UI, sans-serif" font-size="10" fill="#E8E8E8">unrecognized app from starting. Running this app</text>
    <text x="55" y="112" font-family="Segoe UI, sans-serif" font-size="10" fill="#E8E8E8">might put your PC at risk.</text>
    <text x="55" y="138" font-family="Segoe UI, sans-serif" font-size="10" fill="#fff">App: Welcome.bat</text>
    <text x="55" y="152" font-family="Segoe UI, sans-serif" font-size="10" fill="#E8E8E8">Publisher: Unknown publisher</text>
    <!-- Don't run button (default) -->
    <rect x="180" y="160" width="90" height="22" fill="#fff"/>
    <text x="225" y="175" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#1D2433">Don't run</text>
  </g>
  <!-- Annotation -->
  <g>
    <text x="160" y="210" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#0F1E33">Don't click "Don't run" yet — see step 2</text>
  </g>
</svg>
