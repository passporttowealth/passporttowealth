<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="gk1-title gk1-desc">
  <title id="gk1-title">Step 1: Mac shows the warning dialog</title>
  <desc id="gk1-desc">macOS Gatekeeper alert reading "Welcome.command cannot be opened because Apple cannot check it for malicious software". Click Cancel.</desc>
  <defs>
    <filter id="sh1" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="320" height="220" fill="#FAF8F4"/>
  <!-- Dialog window -->
  <g filter="url(#sh1)">
    <rect x="50" y="30" width="220" height="160" rx="10" fill="#F2F2F2" stroke="#D1D1D1" stroke-width="0.5"/>
    <!-- Title bar -->
    <rect x="50" y="30" width="220" height="22" rx="10" fill="#E8E8E8"/>
    <rect x="50" y="40" width="220" height="12" fill="#E8E8E8"/>
    <!-- Traffic lights -->
    <circle cx="62" cy="41" r="4" fill="#FF5F57"/>
    <circle cx="74" cy="41" r="4" fill="#FEBC2E"/>
    <circle cx="86" cy="41" r="4" fill="#28C840"/>
    <!-- Warning icon (shield) -->
    <g transform="translate(70,68)">
      <circle cx="20" cy="20" r="20" fill="#FFB800"/>
      <text x="20" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
            font-size="24" font-weight="700" fill="#fff">!</text>
    </g>
    <!-- Body text -->
    <text x="120" y="78" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#1D2433">"Welcome.command" cannot be</text>
    <text x="120" y="91" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#1D2433">opened because Apple cannot</text>
    <text x="120" y="104" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#1D2433">check it for malicious software.</text>
    <text x="120" y="124" font-family="-apple-system, sans-serif" font-size="8" fill="#5E6473">This software needs to be updated.</text>
    <text x="120" y="135" font-family="-apple-system, sans-serif" font-size="8" fill="#5E6473">Contact the developer for more</text>
    <text x="120" y="146" font-family="-apple-system, sans-serif" font-size="8" fill="#5E6473">information.</text>
    <!-- Buttons -->
    <rect x="148" y="158" width="50" height="22" rx="5" fill="#fff" stroke="#C8C8C8"/>
    <text x="173" y="173" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#1D2433">Help</text>
    <!-- "Cancel" — highlighted with our brand callout -->
    <rect x="208" y="158" width="50" height="22" rx="5" fill="#0F1E33"/>
    <text x="233" y="173" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#fff" font-weight="600">Cancel</text>
  </g>
  <!-- Annotation: arrow + label pointing at Cancel -->
  <g>
    <path d="M 280 195 Q 270 185 250 175" stroke="#0F1E33" stroke-width="1.5" fill="none" marker-end="url(#a1)"/>
    <text x="280" y="210" font-family="-apple-system, sans-serif" font-size="11" fill="#0F1E33" font-weight="600">Click Cancel</text>
  </g>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F1E33"/>
    </marker>
  </defs>
</svg>
